name: Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      # OVOS dependencies ship as alphas; resolve them the way the alpha channel does.
      uv_prerelease: 'allow'
      install_extras: 'dev'
      # ggwave (a test dependency) pulls in PyAudio, which needs portaudio to build.
      system_deps: 'portaudio19-dev'
      # The page tests run every page in a real browser; it is a separate
      # download from the playwright package. With the variable set, a missing
      # browser fails the build instead of skipping the gate.
      pre_test_command: 'python -m playwright install --with-deps chromium'
      test_env: 'OVOS_WEBUI_REQUIRE_BROWSER=1'
      test_path: 'tests'
