[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-control-panel"
dynamic = ["version"]
description = "Control panel for OpenVoiceOS devices — settings, plugins, skills, transformers, intents, media, network, sensors and more, in your browser"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "control-panel", "configuration", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Environment :: Web Environment",
]
dependencies = [
    # floors chosen to keep a frozen install off known-vulnerable builds:
    # starlette>=0.40 fixes the multipart buffering DoS CVE-2024-47874 (a
    # fastapi floor alone is not enough — 0.111 still pins starlette<0.38), and
    # python-multipart>=0.0.18 fixes the form-parser DoS CVE-2024-53981.
    "fastapi>=0.115.3",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.18",
    "PyYAML>=5.4",
    "ovos-bus-client>=1.0.0",
    "ovos-config>=1.0.0",
    "ovos-utils>=0.3.0",
    "ovos-plugin-manager>=1.0.0",
    "ovos-workshop>=2.0.0",
    "ovos-mark1-utils>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<1.0",
    "pytest-cov>=4.1",
    # Two real transformer plugins the tests expect to be installed: the audio
    # test asserts ggwave is offered, and the utterance test asserts the
    # normalizer (registered under the legacy neon group) is offered. Without
    # them those tests fail in a clean environment.
    "ovos-audio-transformer-plugin-ggwave>=0.0.5",
    "ovos-utterance-normalizer>=0.2.3",
    # A real browser, because nothing else notices a page whose script dies on
    # load: the markup is still there, the strings are still there, the routes
    # still answer, and the page does nothing. See tests/test_pages_run.py.
    "playwright>=1.44",
    # A bus for scripts/screenshots.py to stand a device up on. Shooting the
    # panel with nothing behind it photographs a device that is not answering,
    # under captions that say every service is ready.
    "ovos-messagebus>=0.2.1a3",
    # A handful of real skills, so the pages that list what a device can do are
    # photographed listing something. A shoot against an empty environment
    # produces "no skills are installed" under a caption promising a list.
    "ovos-skill-hello-world>=0.0.1",
    "ovos-skill-date-time>=0.0.1",
    "ovos-skill-personal>=0.0.1",
]

[project.scripts]
ovos-control-panel = "ovos_webui.service:main"
# kept so an existing `ovos-webui` command still works after the rename
ovos-webui = "ovos_webui.service:main"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-control-panel"
"Bug Tracker" = "https://github.com/OpenVoiceOS/ovos-control-panel/issues"

[tool.setuptools.dynamic]
version = { attr = "ovos_webui.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_webui*"]

[tool.setuptools.package-data]
ovos_webui = ["static/*"]

[tool.pytest.ini_options]

testpaths = ["tests"]

[tool.coverage.run]
source = ["ovos_webui"]
omit = ["tests/*"]

[tool.ruff.lint.per-file-ignores]
# conftest sets the XDG environment before importing anything from OVOS, so its
# own imports deliberately come after that setup and cannot move to the top.
"tests/conftest.py" = ["E402"]
