<!doctype html>
<html lang="en"{{html_attrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{{title}} — {{brand}}</title>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<link rel="stylesheet" href="/static/branding.css">
<link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
<link rel="manifest" href="/static/manifest.webmanifest">
<script src="/static/app.js?v={{v}}"></script>
{{nav}}</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<div class="banner" id="banner" role="alert" hidden></div>
<header><h1{{heading_key}}>{{heading}}</h1>
  {{mark}}</header>
<nav aria-label="Site" data-i18n-attr="aria-label:nav.aria" id="sitenav">
  <a href="/" data-i18n="nav.dashboard">Dashboard</a>
</nav>
<main id="main" tabindex="-1" data-page="{{id}}">
{{body}}{{origin}}
</main>
</body>
</html>
